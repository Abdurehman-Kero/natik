# Local development services. Start with `pnpm services:up` (or `pnpm dev`).
# Ports are bound to 127.0.0.1 and chosen to avoid clashing with other local projects.
#
#   PostgreSQL  localhost:5440   natik / natik   (databases: natik, natik_test)
#   Redis       localhost:6380
#   Storage     localhost:9010   S3 API (RustFS)  ·  console http://localhost:9011
#   Mailpit     localhost:1026   SMTP  ·  inbox http://localhost:8026
name: natik

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: natik
      POSTGRES_PASSWORD: natik
      POSTGRES_DB: natik
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U natik -d natik']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  # S3-compatible private file storage (MinIO no longer publishes community images).
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: natik
      RUSTFS_SECRET_KEY: natik-dev-secret
      RUSTFS_VOLUMES: /data
    ports:
      - '127.0.0.1:9010:9000'
      - '127.0.0.1:9011:9001'
    volumes:
      - storage-data:/data

  # One-shot: creates the private bucket. Run by `pnpm services:up`.
  storage-init:
    image: rclone/rclone:1.75.2
    profiles: ['init']
    depends_on:
      - storage
    environment:
      RCLONE_CONFIG_NATIK_TYPE: s3
      RCLONE_CONFIG_NATIK_PROVIDER: Other
      RCLONE_CONFIG_NATIK_ENDPOINT: http://storage:9000
      RCLONE_CONFIG_NATIK_ACCESS_KEY_ID: natik
      RCLONE_CONFIG_NATIK_SECRET_ACCESS_KEY: natik-dev-secret
      RCLONE_CONFIG_NATIK_FORCE_PATH_STYLE: 'true'
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for i in $$(seq 1 30); do
          if rclone mkdir natik:natik-private 2>/dev/null; then
            echo "Bucket natik-private is ready"; exit 0
          fi
          sleep 1
        done
        echo "Could not create bucket natik-private"; exit 1

  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'

volumes:
  postgres-data:
  redis-data:
  storage-data:
