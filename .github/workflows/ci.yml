name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: API integration tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: natik
          POSTGRES_PASSWORD: natik
          POSTGRES_DB: natik_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U natik -d natik_test"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://natik:natik@localhost:5432/natik_test?schema=public
      TEST_DATABASE_URL: postgresql://natik:natik@localhost:5432/natik_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  e2e:
    name: Browser tests (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: natik
          POSTGRES_PASSWORD: natik
          POSTGRES_DB: natik
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U natik -d natik"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://natik:natik@localhost:5432/natik?schema=public
      REDIS_URL: redis://localhost:6379
      SEED_OWNER_NAME: Natik Owner
      SEED_OWNER_PHONE: '+251911000000'
      SEED_OWNER_PASSWORD: ChangeMe2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@natik/web --filter=@natik/api
      - run: pnpm --filter @natik/api db:deploy
      - run: pnpm --filter @natik/api db:seed
      - run: pnpm --filter @natik/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Speed budgets (Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: natik
          POSTGRES_PASSWORD: natik
          POSTGRES_DB: natik
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U natik -d natik"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: local
      DATABASE_URL: postgresql://natik:natik@localhost:5432/natik?schema=public
      REDIS_URL: redis://localhost:6379
      SEED_OWNER_NAME: Natik Owner
      SEED_OWNER_PHONE: '+251911000000'
      SEED_OWNER_PASSWORD: ChangeMe2026
      RUN_WORKER_IN_API: 'true'
      API_INTERNAL_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@natik/web --filter=@natik/api
      - run: pnpm --filter @natik/api db:deploy
      - run: pnpm --filter @natik/api db:seed
      - name: Start the API and the website
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm exec next start --port 3100 > ../../web.log 2>&1 &)
          npx --yes wait-on@8 http://localhost:4000/api/v1/health http://localhost:3100 --timeout 120000
      - name: 'Lighthouse (phone, slow 4G) - budgets from plan/DESIGN.md §15'
        run: pnpm lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t natik-web:ci .
      - name: Build API / worker image
        run: docker build -f apps/api/Dockerfile -t natik-api:ci .
      - name: Build migration image
        run: docker build -f apps/api/Dockerfile --target migrate -t natik-migrate:ci .
      - name: API image starts and reports its version
        run: docker run --rm --entrypoint node natik-api:ci -e "console.log(require('./package.json').name)"
